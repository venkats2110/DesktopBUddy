; Deskbot - Phase 2 (face engine)
; Board: 7Semi ESP32-S3-WROOM-1U-N16R8 (16 MB flash, 8 MB octal PSRAM)
; Rule: never enable Wi-Fi or Bluetooth (no antenna). Never use GPIO 35/36/37.

[env:deskbot]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; 16 MB flash + octal PSRAM (N16R8)
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1          ; native USB in CDC/JTAG mode
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = native USB port

; Uncomment and set once you know your port name:
upload_port = /dev/cu.usbmodem2101
monitor_port = /dev/cu.usbmodem2101

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    madhephaestus/ESP32Servo